between; font-size:15px; color:#7f8bb3; }\n<\/style>\n<style><\/style><style>\n/* Step-by-step builds for the CTA slides. Loaded by the *-animated.html files. */\nhtml, body { height:100%; margin:0; overflow:hidden; background:#0C1737; cursor:default; }\n.slide { position:absolute; top:0; left:0; transform-origin:0 0; }\n\n/* A build step: fades and slides up when it becomes active */\n.b { opacity:0; transform:translateY(26px); transition:opacity .55s ease, transform .7s cubic-bezier(.2,.8,.2,1); }\n.b.on { opacity:1; transform:none; transition-delay:var(--d, 0ms); }\n\n/* Items inside a step (bullets, chips) arrive one after another */\n.sub { opacity:0; transform:translateY(12px); transition:opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1); }\n.on .sub { opacity:1; transform:none; transition-delay:var(--d, 0ms); }\n\n/* Facts in the \"Why now\" strip slide in from the left */\n.why .facts > .sub { transform:translateX(-22px); }\n.why.on .facts > .sub { transform:none; }\n\n/* Only while a number counts up: fixed-width digits so the text beside it stays put */\n.big.counting { font-variant-numeric:tabular-nums; display:inline-block; }\n\n/* Highlighted policy-chain chips pulse once after the chain lands */\n@keyframes hotpulse {\n  0%   { box-shadow:0 0 0 0 rgba(239,123,48,0); }\n  45%  { box-shadow:0 0 0 9px rgba(239,123,48,.38); }\n  100% { box-shadow:0 0 0 0 rgba(239,123,48,0); }\n}\n.chain.on .chip.hot { animation:hotpulse 1.1s ease var(--h, 1s) 1 both; }\n\n/* ?static renders the final state of a step with no motion (used for PNG export) */\nhtml.static .b, html.static .sub { transition:none !important; }\nhtml.static .chip.hot { animation:none !important; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide\">\n  <div class=\"eyebrow\">Your next move<\/div>\n  <h1>Give every agent <em>an ID<\/em><\/h1>\n\n  <div class=\"why\">\n    <div class=\"lbl\">Why now:<br>doors are closing<\/div>\n    <div class=\"facts\">\n      <div><b>JPMorgan Chase<\/b> bans agents that log in<br>with your credentials<\/div>\n      <div class=\"sep\"><\/div>\n      <div><b>Wells Fargo<\/b>: \u201cYour use of any AI Agent<br>is AT YOUR OWN RISK\u201d<\/div>\n      <div class=\"sep\"><\/div>\n      <div><b>Amazon<\/b> blocks Meta\u2019s Muse; <b>United<\/b><br>blocks bots from buying flights<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"cards\">\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">1<\/div><div><div class=\"verb\">The case<\/div><div class=\"what\">Identify, don\u2019t block<\/div><\/div><\/div>\n      <ul class=\"feat\">\n        <li><b>Blocking is an arms race:<\/b> agents keep getting better at looking like a browser<\/li>\n        <li><b>Borrowed passwords, shared liability:<\/b> nobody can tell whether the customer or the agent acted<\/li>\n        <li><b>Blunt revocation:<\/b> stopping one rogue agent means resetting the customer\u2019s account<\/li>\n        <li><b>Agents come and go in a day:<\/b> manual app onboarding can\u2019t keep up<\/li>\n      <\/ul>\n      <div class=\"note\">From the Choreo Labs blog, 3 Nov 2026<\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">2<\/div><div><div class=\"verb\">The fix<\/div><div class=\"what\">Agent Identity<\/div><\/div><\/div>\n      <ul class=\"feat\">\n        <li><b>Self-service onboarding:<\/b> agents register on first contact, with their own keys<\/li>\n        <li><b>Agent-signed requests:<\/b> every call names the human <i>and<\/i> the agent<\/li>\n        <li><b>Intent-scoped consent:<\/b> short-lived access for one task, and out-of-band approval for risky actions<\/li>\n        <li><b>Surgical revocation:<\/b> revoke one agent, not the customer<\/li>\n      <\/ul>\n      <div class=\"note\"><span class=\"url\">choreolabs.com/identity-platform/agent-id<\/span><\/div>\n    <\/div>\n\n    <div class=\"card primary\">\n      <div class=\"head\"><div class=\"num\">3<\/div><div><div class=\"verb\">ON Monday morning<\/div><div class=\"what\">Ask your team 5 questions<\/div><\/div><\/div>\n      <ul class=\"check\">\n        <li><span class=\"box\"><\/span><span><b>Visibility:<\/b> can our logs tell an agent from a human?<\/span><\/li>\n        <li><span class=\"box\"><\/span><span><b>Attribution:<\/b> is every call tied to the agent <i>and<\/i> the user?<\/span><\/li>\n        <li><span class=\"box\"><\/span><span><b>Onboarding:<\/b> can a new agent register without a ticket?<\/span><\/li>\n        <li><span class=\"box\"><\/span><span><b>Transparency:<\/b> can customers see the agents they authorized?<\/span><\/li>\n        <li><span class=\"box\"><\/span><span><b>Revocation:<\/b> can we kill one agent without locking out the customer?<\/span><\/li>\n      <\/ul>\n      <div class=\"note\">Any \u201cno\u201d is <b>an identity gap, not an app bug.<\/b><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"foot\">\n    <span>Sources: WIRED, \u201cBanks Have Had It Up to Here With Your AI Agent\u201d, 22 Nov 2026 \u00b7 Choreo Labs, \u201cSecuring the agents your customers bring\u201d, 3 Nov 2026<\/span>  <\/div>\n<\/div>\n\n\n\n<script>\n/*\n  Step-by-step builds for the CTA slides.\n  Next: \u2192 \u2193 Space Enter PageDown or click.  Back: \u2190 \u2191 PageUp Backspace or right-click.\n  Home / End: first / last step.  F: full screen.\n  URL options: ?step=N opens at step N.  ?static shows that step with no motion.\n*/\n(function () {\n  const params = new URLSearchParams(location.search);\n  const isStatic = params.has('static');\n  if (isStatic) document.documentElement.classList.add('static');\n\n  const slide = document.querySelector('.slide');\n  let n = 0;\n  const labels = ['Title'];\n  const clean = el => (el ? el.textContent.replace(/\\s+/g, ' ').trim() : '');\n  const short = t => (t.length > 70 ? t.slice(0, 67).trimEnd() + '\u2026' : t);\n\n  const mark = (el, step, delay) => {\n    if (!el) return;\n    el.classList.add('b');\n    el.dataset.step = step;\n    if (delay) el.style.setProperty('--d', delay + 'ms');\n  };\n  const stagger = (els, start, gap) => {\n    let t = start;\n    els.forEach(el => { el.classList.add('sub'); el.style.setProperty('--d', t + 'ms'); t += gap; });\n    return t;\n  };\n\n  // Step 0: eyebrow, title, sources\n  mark(slide.querySelector('.eyebrow'), 0, 0);\n  mark(slide.querySelector('h1'), 0, 160);\n  mark(slide.querySelector('.foot'), 0, 500);\n\n  // \"Why now\" strip: one step, its facts arrive one after another\n  const why = slide.querySelector('.why');\n  if (why) {\n    n++;\n    mark(why, n);\n    labels[n] = 'Why now';\n    stagger([...why.querySelector('.facts').children], 220, 150);\n  }\n\n  // Cards: one per step, bullets arrive in order\n  slide.querySelectorAll('.cards > .card').forEach((card, i) => {\n    n++;\n    labels[n] = `Card ${i + 1}: ` + [clean(card.querySelector('.verb')), clean(card.querySelector('.what'))].filter(Boolean).join(', ');\n    mark(card, n);\n    stagger([...card.querySelectorAll('li, p, .qrrow, .note, .where')], 260, 110);\n  });\n\n  // Bottom chip strip\n  const chain = slide.querySelector('.chain');\n  if (chain) {\n    n++;\n    labels[n] = short(clean(chain.querySelector('.lead')) || 'Bottom strip');\n    mark(chain, n);\n    const end = stagger([...chain.children], 120, 60);\n    chain.style.setProperty('--h', end + 250 + 'ms');\n  }\n\n  const max = n;\n  // Read by edit-server.py when it exports the build steps and the Keynote file\n  document.documentElement.dataset.steps = max + 1;\n  document.documentElement.dataset.labels = JSON.stringify(labels);\n  const stepOf = el => +el.closest('[data-step]').dataset.step;\n  const items = [...slide.querySelectorAll('[data-step]')];\n\n  // Count-up numbers (98%, 150,000+, 341\u2026)\n  const counters = [...slide.querySelectorAll('.big')].map(el => {\n    const m = el.textContent.match(/^(\\D*)([\\d,]+)(.*)$/);\n    return m && { el, pre: m[1], target: +m[2].replace(/,/g, ''), comma: m[2].includes(','), post: m[3], text: el.textContent, step: stepOf(el) };\n  }).filter(Boolean);\n  const fmt = (c, v) => c.pre + (c.comma ? v.toLocaleString('en-US') : String(v)) + c.post;\n  const countUp = c => {\n    const t0 = performance.now(), dur = 1300;\n    c.el.classList.add('counting');\n    c.el.style.minWidth = c.el.getBoundingClientRect().width / (slide.getBoundingClientRect().width / 1920) + 'px';\n    const tick = now => {\n      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);\n      c.el.textContent = k < 1 ? fmt(c, Math.round(c.target * e)) : c.text;\n      if (k < 1) requestAnimationFrame(tick);\n      else { c.el.classList.remove('counting'); c.el.style.minWidth = ''; }\n    };\n    c.el.textContent = fmt(c, 0);\n    requestAnimationFrame(tick);\n  };\n\n  let cur = -1;\n  const go = s => {\n    s = Math.max(0, Math.min(max, s));\n    items.forEach(el => el.classList.toggle('on', +el.dataset.step <= s));\n    if (!isStatic) counters.forEach(c => { if (c.step > cur && c.step <= s) countUp(c); });\n    cur = s;\n  };\n\n  // Fit the 1920\u00d71080 slide to any window\n  const fit = () => {\n    const k = Math.min(innerWidth / 1920, innerHeight / 1080);\n    slide.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;\n  };\n  addEventListener('resize', fit);\n  fit();\n\n  addEventListener('keydown', e => {\n    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); }\n    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(cur - 1); }\n    else if (e.key === 'Home') go(0);\n    else if (e.key === 'End') go(max);\n    else if (e.key === 'f' || e.key === 'F') {\n      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();\n    }\n  });\n  addEventListener('click', () => go(cur + 1));\n  addEventListener('contextmenu', e => { e.preventDefault(); go(cur - 1); });\n\n  const start = Math.max(0, Math.min(max, parseInt((window.__deckStart != null ? String(window.__deckStart) : params.get('step')) || '0', 10) || 0));\n  window.__builds = { max, go, get step() { return cur; } };\n  if (isStatic) go(start);\n  else document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(() => go(start))));\n})();\n<\/script>\n<script>\nparent.postMessage({ deck: 'ready', steps: window.__builds.max + 1 }, '*');\naddEventListener('message', e => { if (e.data && e.data.deck === 'go') window.__builds.go(e.data.step); });\n<\/script>\n<\/body><\/html>\n"}, {"name": "finops-solution", "title": "Agent FinOps Playbook", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<script>window.__deckStart = __START__;<\/script>\n<meta charset=\"utf-8\">\n<title>Agent FinOps Playbook<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block\" rel=\"stylesheet\">\n<style>\n  :root { --bg:#0C1737; --card:#13214a; --line:#26386f; --orange:#EF7B30; --muted:#9fabcf; }\n  html,body { margin:0; background:var(--bg); }\n  .slide { width:1920px; height:1080px; box-sizing:border-box; padding:72px 96px 52px; background:radial-gradient(1100px 600px at 85% 0%, #1a2c63 0%, #0C1737 65%); color:#fff; font-family:Inter, Helvetica, Arial, sans-serif; display:flex; flex-direction:column; }\n  .eyebrow { font-weight:800; font-size:20px; letter-spacing:.14em; color:var(--orange); text-transform:uppercase; }\n  h1 { margin:14px 0 0; font-size:62px; line-height:1.06; font-weight:900; letter-spacing:-.015em; }\n  h1 em { font-style:normal; color:var(--orange); }\n\n  .why { margin-top:30px; display:flex; align-items:center; gap:30px; padding:18px 28px; border-left:6px solid var(--orange); background:rgba(239,123,48,.08); border-radius:0 14px 14px 0; }\n  .why .lbl { font-weight:900; font-size:18px; letter-spacing:.12em; color:var(--orange); text-transform:uppercase; white-spa chip.hot { border-color:var(--orange); color:#fff; background:rgba(239,123,48,.14); }\n  .arr { color:#56679c; }\n\n  .foot { margin-top:18px; font-size:14px; color:#7f8bb3; }\n<\/style>\n<style>\n/* Step-by-step builds for the CTA slides. Loaded by the *-animated.html files. */\nhtml, body { height:100%; margin:0; overflow:hidden; background:#0C1737; cursor:default; }\n.slide { position:absolute; top:0; left:0; transform-origin:0 0; }\n\n/* A build step: fades and slides up when it becomes active */\n.b { opacity:0; transform:translateY(26px); transition:opacity .55s ease, transform .7s cubic-bezier(.2,.8,.2,1); }\n.b.on { opacity:1; transform:none; transition-delay:var(--d, 0ms); }\n\n/* Items inside a step (bullets, chips) arrive one after another */\n.sub { opacity:0; transform:translateY(12px); transition:opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1); }\n.on .sub { opacity:1; transform:none; transition-delay:var(--d, 0ms); }\n\n/* Facts in the \"Why now\" strip slide in from the left */\n.why .facts > .sub { transform:translateX(-22px); }\n.why.on .facts > .sub { transform:none; }\n\n/* Only while a number counts up: fixed-width digits so the text beside it stays put */\n.big.counting { font-variant-numeric:tabular-nums; display:inline-block; }\n\n/* Highlighted policy-chain chips pulse once after the chain lands */\n@keyframes hotpulse {\n  0%   { box-shadow:0 0 0 0 rgba(239,123,48,0); }\n  45%  { box-shadow:0 0 0 9px rgba(239,123,48,.38); }\n  100% { box-shadow:0 0 0 0 rgba(239,123,48,0); }\n}\n.chain.on .chip.hot { animation:hotpulse 1.1s ease var(--h, 1s) 1 both; }\n\n/* ?static renders the final state of a step with no motion (used for PNG export) */\nhtml.static .b, html.static .sub { transition:none !important; }\nhtml.static .chip.hot { animation:none !important; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide\">\n  <div class=\"eyebrow\">Agent FinOps \u00b7 The fix<\/div>\n  <h1>Every token needs <em>an owner<\/em>, <em>a budget<\/em><br>and <em>an off switch<\/em>.<\/h1>\n\n  <div class=\"why\">\n    <div class=\"lbl\">Why now<\/div>\n    <div class=\"facts\">\n      <div><span class=\"big\">98%<\/span> of FinOps teams now manage AI spend,<br>up from 31% two years ago<\/div>\n      <div class=\"sep\"><\/div>\n      <div><b>Tokens are only part of the bill:<\/b> tool calls,<br>retries and vector lookups add up too<\/div>\n      <div class=\"sep\"><\/div>\n      <div><b>Runaway loops show up on the invoice,<\/b><br>not on a dashboard, unless you cap them<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"cards\">\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">1<\/div><div><div class=\"verb\">See<\/div><div class=\"what\">Know who burns what<\/div><\/div><\/div>\n      <ul>\n        <li><b>Tokens and $ by user, team, app, agent and model<\/b>, tied to an identity, not a shared key<\/li>\n        <li>Count <b>tool calls and retries<\/b>, not just tokens<\/li>\n        <li>Track <b>cost per task or outcome<\/b>, not cost per token<\/li>\n        <li>Find <b>shadow agents<\/b> and unapproved models<\/li>\n      <\/ul>\n      <div class=\"where\">Runs in <span>AI Insights \u00b7 Agent Identity \u00b7 Shadow AI Discovery<\/span><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">2<\/div><div><div class=\"verb\">Optimize<\/div><div class=\"what\">Spend less per task<\/div><\/div><\/div>\n      <ul>\n        <li><b>Use cheaper models when they\u2019re good enough:<\/b> route by task and budget, keep frontier models for hard cases<\/li>\n        <li><b>Cache:<\/b> semantic cache and provider prompt caching<\/li>\n        <li><b>Trim tool usage:<\/b> expose only the tools an agent needs, and stop repeat calls<\/li>\n        <li><b>Prompt compression<\/b>, and batch jobs that aren\u2019t urgent<\/li>\n      <\/ul>\n      <div class=\"where\">Runs in <span>AI Gateway<\/span><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">3<\/div><div><div class=\"verb\">Cap<\/div><div class=\"what\">Stop rogue agents early<\/div><\/div><\/div>\n      <ul>\n        <li><b>Budgets and rate limits<\/b> on calls, tokens and $ per app, user, team or JWT claim<\/li>\n        <li><b>Max turns and loop detection<\/b> on traces: alert, then suspend<\/li>\n        <li><b>One off switch per agent.<\/b> No shared prod keys<\/li>\n        <li><b>Dev sandboxes with quotas:<\/b> freedom to build, within limits<\/li>\n      <\/ul>\n      <div class=\"where\">Runs in <span>AI Gateway \u00b7 Agent Manager<\/span><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">4<\/div><div><div class=\"verb\">Charge back<\/div><div class=\"what\">Make it someone\u2019s budget<\/div><\/div><\/div>\n      <ul>\n        <li><b>Showback first:<\/b> publish cost per team for a few weeks and fix tagging gaps<\/li>\n        <li><b>Then internal chargeback<\/b> to team cost centers<\/li>\n        <li><b>Budgets per team and use case<\/b>, with forecasts and alerts<\/li>\n        <li>Report <b>cost vs. value<\/b> for each use case<\/li>\n      <\/ul>\n      <div class=\"where\">Runs in <span>FinOps &amp; Chargeback \u00b7 Agent Control Plane<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"chain\">\n    <span class=\"lead\">On every call<\/span>\n    <span class=\"chip\">Authenticate<\/span><span class=\"arr\">\u2192<\/span>\n    <span class=\"chip hot\">Rate &amp; budget<\/span><span class=\"arr\">\u2192<\/span>\n    <span class=\"chip\">Guard input<\/span><span class=\"arr\">\u2192<\/span>\n    <span class=\"chip hot\">Semantic cache<\/span><span class=\"arr\">\u2192<\/span>\n    <span class=\"chip hot\">Optimize<\/span><span class=\"arr\">\u2192<\/span>\n    <span class=\"chip hot\">Route<\/span><span class=\"arr\">\u2192<\/span>\n    <span class=\"chip\">LLM<\/span>\n  <\/div>\n\n  <div class=\"foot\">Source: FinOps Foundation, State of FinOps 2026 (data.finops.org).<\/div>\n<\/div>\n<script>\n/*\n  Step-by-step builds for the CTA slides.\n  Next: \u2192 \u2193 Space Enter PageDown or click.  Back: \u2190 \u2191 PageUp Backspace or right-click.\n  Home / End: first / last step.  F: full screen.\n  URL options: ?step=N opens at step N.  ?static shows that step with no motion.\n*/\n(function () {\n  const params = new URLSearchParams(location.search);\n  const isStatic = params.has('static');\n  if (isStatic) document.documentElement.classList.add('static');\n\n  const slide = document.querySelector('.slide');\n  let n = 0;\n  const labels = ['Title'];\n  const clean = el => (el ? el.textContent.replace(/\\s+/g, ' ').trim() : '');\n  const short = t => (t.length > 70 ? t.slice(0, 67).trimEnd() + '\u2026' : t);\n\n  const mark = (el, step, delay) => {\n    if (!el) return;\n    el.classList.add('b');\n    el.dataset.step = step;\n    if (delay) el.style.setProperty('--d', delay + 'ms');\n  };\n  const stagger = (els, start, gap) => {\n    let t = start;\n    els.forEach(el => { el.classList.add('sub'); el.style.setProperty('--d', t + 'ms'); t += gap; });\n    return t;\n  };\n\n  // Step 0: eyebrow, title, sources\n  mark(slide.querySelector('.eyebrow'), 0, 0);\n  mark(slide.querySelector('h1'), 0, 160);\n  mark(slide.querySelector('.foot'), 0, 500);\n\n  // \"Why now\" strip: one step, its facts arrive one after another\n  const why = slide.querySelector('.why');\n  if (why) {\n    n++;\n    mark(why, n);\n    labels[n] = 'Why now';\n    stagger([...why.querySelector('.facts').children], 220, 150);\n  }\n\n  // Cards: one per step, bullets arrive in order\n  slide.querySelectorAll('.cards > .card').forEach((card, i) => {\n    n++;\n    labels[n] = `Card ${i + 1}: ` + [clean(card.querySelector('.verb')), clean(card.querySelector('.what'))].filter(Boolean).join(', ');\n    mark(card, n);\n    stagger([...card.querySelectorAll('li, p, .qrrow, .note, .where')], 260, 110);\n  });\n\n  // Bottom chip strip\n  const chain = slide.querySelector('.chain');\n  if (chain) {\n    n++;\n    labels[n] = short(clean(chain.querySelector('.lead')) || 'Bottom strip');\n    mark(chain, n);\n    const end = stagger([...chain.children], 120, 60);\n    chain.style.setProperty('--h', end + 250 + 'ms');\n  }\n\n  const max = n;\n  // Read by edit-server.py when it exports the build steps and the Keynote file\n  document.documentElement.dataset.steps = max + 1;\n  document.documentElement.dataset.labels = JSON.stringify(labels);\n  const stepOf = el => +el.closest('[data-step]').dataset.step;\n  const items = [...slide.querySelectorAll('[data-step]')];\n\n  // Count-up numbers (98%, 150,000+, 341\u2026)\n  const counters = [...slide.querySelectorAll('.big')].map(el => {\n    const m = el.textContent.match(/^(\\D*)([\\d,]+)(.*)$/);\n    return m && { el, pre: m[1], target: +m[2].replace(/,/g, ''), comma: m[2].includes(','), post: m[3], text: el.textContent, step: stepOf(el) };\n  }).filter(Boolean);\n  const fmt = (c, v) => c.pre + (c.comma ? v.toLocaleString('en-US') : String(v)) + c.post;\n  const countUp = c => {\n    const t0 = performance.now(), dur = 1300;\n    c.el.classList.add('counting');\n    c.el.style.minWidth = c.el.getBoundingClientRect().width / (slide.getBoundingClientRect().width / 1920) + 'px';\n    const tick = now => {\n      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);\n      c.el.textContent = k < 1 ? fmt(c, Math.round(c.target * e)) : c.text;\n      if (k < 1) requestAnimationFrame(tick);\n      else { c.el.classList.remove('counting'); c.el.style.minWidth = ''; }\n    };\n    c.el.textContent = fmt(c, 0);\n    requestAnimationFrame(tick);\n  };\n\n  let cur = -1;\n  const go = s => {\n    s = Math.max(0, Math.min(max, s));\n    items.forEach(el => el.classList.toggle('on', +el.dataset.step <= s));\n    if (!isStatic) counters.forEach(c => { if (c.step > cur && c.step <= s) countUp(c); });\n    cur = s;\n  };\n\n  // Fit the 1920\u00d71080 slide to any window\n  const fit = () => {\n    const k = Math.min(innerWidth / 1920, innerHeight / 1080);\n    slide.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;\n  };\n  addEventListener('resize', fit);\n  fit();\n\n  addEventListener('keydown', e => {\n    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); }\n    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(cur - 1); }\n    else if (e.key === 'Home') go(0);\n    else if (e.key === 'End') go(max);\n    else if (e.key === 'f' || e.key === 'F') {\n      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();\n    }\n  });\n  addEventListener('click', () => go(cur + 1));\n  addEventListener('contextmenu', e => { e.preventDefault(); go(cur - 1); });\n\n  const start = Math.max(0, Math.min(max, parseInt((window.__deckStart != null ? String(window.__deckStart) : params.get('step')) || '0', 10) || 0));\n  window.__builds = { max, go, get step() { return cur; } };\n  if (isStatic) go(start);\n  else document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(() => go(start))));\n})();\n<\/script>\n<script>\nparent.postMessage({ deck: 'ready', steps: window.__builds.max + 1 }, '*');\naddEventListener('message', e => { if (e.data && e.data.deck === 'go') window.__builds.go(e.data.step); });\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "governance-solution", "title": "Agent Governance Playbook", "html": "<!doctype html>\n<html lang=\"en\"><head>\n<script>window.__deckStart = __START__;<\/script>\n<meta charset=\"utf-8\">\n<title>Agent Governance Playbook<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=block\" rel=\"stylesheet\">\n<style>\n  :root { --bg:#0C1737; --card:#13214a; --line:#26386f; --orange:#EF7B30; --muted:#9fabcf; }\n  html,body e); text-transform:uppercase; }\n  .what { font-size:27px; font-weight:800; line-height:1.15; margin-top:2px; min-height:62px; }\n  ul { list-style:none; padding:0; margin:22px 0 0; display:flex; flex-direction:column; gap:15px; }\n  li { font-size:19px; line-height:1.36; color:#d6ddf2; padding-left:22px; position:relative; }\n  li::before { content:\"\"; position:absolute; left:0; top:10px; width:9px; height:9px; border-radius:50%; background:var(--orange); }\n  li b { color:#fff; }\n  .where { margin-top:auto; padding-top:16px; border-top:1px solid var(--line); font-size:15px; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; font-weight:700; }\n  .where span { color:#ffb98a; }\n\n  .chain { margin-top:24px; display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; color:#c9d1ea; }\n  .chain .lead { color:var(--orange); letter-spacing:.12em; text-transform:uppercase; font-weight:900; margin-right:8px; }\n  .chip { padding:9px 15px; border-radius:10px; background:#13214a; border:1px solid var(--line); }\n  .foot { margin-top:18px; font-size:14px; color:#7f8bb3; }\n<\/style>\n<style><\/style><style>\n/* Step-by-step builds for the CTA slides. Loaded by the *-animated.html files. */\nhtml, body { height:100%; margin:0; overflow:hidden; background:#0C1737; cursor:default; }\n.slide { position:absolute; top:0; left:0; transform-origin:0 0; }\n\n/* A build step: fades and slides up when it becomes active */\n.b { opacity:0; transform:translateY(26px); transition:opacity .55s ease, transform .7s cubic-bezier(.2,.8,.2,1); }\n.b.on { opacity:1; transform:none; transition-delay:var(--d, 0ms); }\n\n/* Items inside a step (bullets, chips) arrive one after another */\n.sub { opacity:0; transform:translateY(12px); transition:opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1); }\n.on .sub { opacity:1; transform:none; transition-delay:var(--d, 0ms); }\n\n/* Facts in the \"Why now\" strip slide in from the left */\n.why .facts > .sub { transform:translateX(-22px); }\n.why.on .facts > .sub { transform:none; }\n\n/* Only while a number counts up: fixed-width digits so the text beside it stays put */\n.big.counting { font-variant-numeric:tabular-nums; display:inline-block; }\n\n/* Highlighted policy-chain chips pulse once after the chain lands */\n@keyframes hotpulse {\n  0%   { box-shadow:0 0 0 0 rgba(239,123,48,0); }\n  45%  { box-shadow:0 0 0 9px rgba(239,123,48,.38); }\n  100% { box-shadow:0 0 0 0 rgba(239,123,48,0); }\n}\n.chain.on .chip.hot { animation:hotpulse 1.1s ease var(--h, 1s) 1 both; }\n\n/* ?static renders the final state of a step with no motion (used for PNG export) */\nhtml.static .b, html.static .sub { transition:none !important; }\nhtml.static .chip.hot { animation:none !important; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide\">\n  <div class=\"eyebrow\">Agent governance \u00b7 The fix<\/div>\n  <h1>Don\u2019t block agents. <em>Make the governed path<br>the easiest path.<\/em><\/h1>\n\n  <div class=\"why\">\n    <div class=\"lbl\">Why now<\/div>\n    <div class=\"facts\">\n      <div class=\"fact wide\"><span class=\"big\">150,000+<\/span><span>agents per Fortune 500 company<br>by 2028, up from fewer than 15 in 2025<\/span><\/div>\n      <div class=\"sep\"><\/div>\n      <div class=\"fact\"><span class=\"big\">13%<\/span><span>of organizations think they have<br>the right agent governance<\/span><\/div>\n      <div class=\"sep\"><\/div>\n      <div class=\"fact\"><span class=\"big\">22%<\/span><span>of one vendor\u2019s customers found<br>staff running OpenClaw at work<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"cards\">\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">1<\/div><div><div class=\"verb\">Discover<\/div><div class=\"what\">Find what\u2019s already running<\/div><\/div><\/div>\n      <ul>\n        <li><b>Detect shadow agents, models and MCP servers<\/b> from gateway traffic and runtimes<\/li>\n        <li><b>One inventory<\/b> of agents, models, MCP servers, skills and prompts<\/li>\n        <li><b>Internal and external<\/b>: built in-house, bought, built by partners/customers and installed by staff<\/li>\n      <\/ul>\n      <div class=\"where\">Runs in <span>Shadow AI Discovery \u00b7 Asset Discovery &amp; Catalog<\/span><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">2<\/div><div><div class=\"verb\">Identify<\/div><div class=\"what\">Every agent gets an ID and an owner<\/div><\/div><\/div>\n      <ul>\n        <li><b>Register each agent<\/b> with an owner, a purpose and a data scope<\/li>\n        <li><b>Scoped, short-lived credentials<\/b> instead of personal tokens<\/li>\n        <li><b>Sub-agents are registered too<\/b>, with no more access than the parent<\/li>\n        <li><b>Lifecycle:<\/b> review, recertify, retire orphaned agents<\/li>\n      <\/ul>\n      <div class=\"where\">Runs in <span>Agent Identity \u00b7 Agent Manager<\/span><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">3<\/div><div><div class=\"verb\">Control<\/div><div class=\"what\">Policy on every call<\/div><\/div><\/div>\n      <ul>\n        <li><b>All LLM, MCP and A2A traffic<\/b> goes through one gateway<\/li>\n        <li><b>Role-based access<\/b> to models, tools and data<\/li>\n        <li><b>Human approval<\/b> for high-risk actions<\/li>\n        <li><b>Monitor behaviour:<\/b> alert on drift, suspend misbehaving agents<\/li>\n      <\/ul>\n      <div class=\"where\">Runs in <span>AI Gateway \u00b7 Model &amp; Agent Governance \u00b7 AI Observability<\/span><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">4<\/div><div><div class=\"verb\">Enable<\/div><div class=\"what\">Give builders a better path<\/div><\/div><\/div>\n      <ul>\n        <li><b>Self-service portal<\/b> of approved agents, MCP servers and prompts<\/li>\n        <li><b>Sandboxes<\/b> to experiment safely, with a clear path to production<\/li>\n        <li><b>Clear rules<\/b> and a culture of responsible use, not a ban<\/li>\n      <\/ul>\n      <div class=\"where\">Runs in <span>API Portal &amp; AI Hub \u00b7 Agent &amp; MCP Runtime<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"chain\">\n    <span class=\"lead\">Matches Gartner\u2019s six steps<\/span>\n    <span class=\"chip\">Policies<\/span><span class=\"chip\">Inventory<\/span><span class=\"chip\">Identity &amp; lifecycle<\/span><span class=\"chip\">Information governance<\/span><span class=\"chip\">Monitoring<\/span><span class=\"chip\">Culture<\/span>\n  <\/div>\n\n  <div class=\"foot\">Sources: Gartner, \u201cGartner Identifies Six Steps to Manage AI Agent Sprawl\u201d, 28 Apr 2026 \u00b7 Token Security, OpenClaw (then Clawdbot) usage among its customers, Feb 2026.<\/div>\n<\/div>\n\n\n\n<script>\n/*\n  Step-by-step builds for the CTA slides.\n  Next: \u2192 \u2193 Space Enter PageDown or click.  Back: \u2190 \u2191 PageUp Backspace or right-click.\n  Home / End: first / last step.  F: full screen.\n  URL options: ?step=N opens at step N.  ?static shows that step with no motion.\n*/\n(function () {\n  const params = new URLSearchParams(location.search);\n  const isStatic = params.has('static');\n  if (isStatic) document.documentElement.classList.add('static');\n\n  const slide = document.querySelector('.slide');\n  let n = 0;\n  const labels = ['Title'];\n  const clean = el => (el ? el.textContent.replace(/\\s+/g, ' ').trim() : '');\n  const short = t => (t.length > 70 ? t.slice(0, 67).trimEnd() + '\u2026' : t);\n\n  const mark = (el, step, delay) => {\n    if (!el) return;\n    el.classList.add('b');\n    el.dataset.step = step;\n    if (delay) el.style.setProperty('--d', delay + 'ms');\n  };\n  const stagger = (els, start, gap) => {\n    let t = start;\n    els.forEach(el => { el.classList.add('sub'); el.style.setProperty('--d', t + 'ms'); t += gap; });\n    return t;\n  };\n\n  // Step 0: eyebrow, title, sources\n  mark(slide.querySelector('.eyebrow'), 0, 0);\n  mark(slide.querySelector('h1'), 0, 160);\n  mark(slide.querySelector('.foot'), 0, 500);\n\n  // \"Why now\" strip: one step, its facts arrive one after another\n  const why = slide.querySelector('.why');\n  if (why) {\n    n++;\n    mark(why, n);\n    labels[n] = 'Why now';\n    stagger([...why.querySelector('.facts').children], 220, 150);\n  }\n\n  // Cards: one per step, bullets arrive in order\n  slide.querySelectorAll('.cards > .card').forEach((card, i) => {\n    n++;\n    labels[n] = `Card ${i + 1}: ` + [clean(card.querySelector('.verb')), clean(card.querySelector('.what'))].filter(Boolean).join(', ');\n    mark(card, n);\n    stagger([...card.querySelectorAll('li, p, .qrrow, .note, .where')], 260, 110);\n  });\n\n  // Bottom chip strip\n  const chain = slide.querySelector('.chain');\n  if (chain) {\n    n++;\n    labels[n] = short(clean(chain.querySelector('.lead')) || 'Bottom strip');\n    mark(chain, n);\n    const end = stagger([...chain.children], 120, 60);\n    chain.style.setProperty('--h', end + 250 + 'ms');\n  }\n\n  const max = n;\n  // Read by edit-server.py when it exports the build steps and the Keynote file\n  document.documentElement.dataset.steps = max + 1;\n  document.documentElement.dataset.labels = JSON.stringify(labels);\n  const stepOf = el => +el.closest('[data-step]').dataset.step;\n  const items = [...slide.querySelectorAll('[data-step]')];\n\n  // Count-up numbers (98%, 150,000+, 341\u2026)\n  const counters = [...slide.querySelectorAll('.big')].map(el => {\n    const m = el.textContent.match(/^(\\D*)([\\d,]+)(.*)$/);\n    return m && { el, pre: m[1], target: +m[2].replace(/,/g, ''), comma: m[2].includes(','), post: m[3], text: el.textContent, step: stepOf(el) };\n  }).filter(Boolean);\n  const fmt = (c, v) => c.pre + (c.comma ? v.toLocaleString('en-US') : String(v)) + c.post;\n  const countUp = c => {\n    const t0 = performance.now(), dur = 1300;\n    c.el.classList.add('counting');\n    c.el.style.minWidth = c.el.getBoundingClientRect().width / (slide.getBoundingClientRect().width / 1920) + 'px';\n    const tick = now => {\n      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);\n      c.el.textContent = k < 1 ? fmt(c, Math.round(c.target * e)) : c.text;\n      if (k < 1) requestAnimationFrame(tick);\n      else { c.el.classList.remove('counting'); c.el.style.minWidth = ''; }\n    };\n    c.el.textContent = fmt(c, 0);\n    requestAnimationFrame(tick);\n  };\n\n  let cur = -1;\n  const go = s => {\n    s = Math.max(0, Math.min(max, s));\n    items.forEach(el => el.classList.toggle('on', +el.dataset.step <= s));\n    if (!isStatic) counters.forEach(c => { if (c.step > cur && c.step <= s) countUp(c); });\n    cur = s;\n  };\n\n  // Fit the 1920\u00d71080 slide to any window\n  const fit = () => {\n    const k = Math.min(innerWidth / 1920, innerHeight / 1080);\n    slide.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;\n  };\n  addEventListener('resize', fit);\n  fit();\n\n  addEventListener('keydown', e => {\n    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); }\n    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(cur - 1); }\n    else if (e.key === 'Home') go(0);\n    else if (e.key === 'End') go(max);\n    else if (e.key === 'f' || e.key === 'F') {\n      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();\n    }\n  });\n  addEventListener('click', () => go(cur + 1));\n  addEventListener('contextmenu', e => { e.preventDefault(); go(cur - 1); });\n\n  const start = Math.max(0, Math.min(max, parseInt((window.__deckStart != null ? String(window.__deckStart) : params.get('step')) || '0', 10) || 0));\n  window.__builds = { max, go, get step() { return cur; } };\n  if (isStatic) go(start);\n  else document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(() => go(start))));\n})();\n<\/script>\n<script>\nparent.postMessage({ deck: 'ready', steps: window.__builds.max + 1 }, '*');\naddEventListener('message', e => { if (e.data && e.data.deck === 'go') window.__builds.go(e.data.step); });\n<\/script>\n<\/body><\/html>\n"}, {"name": "supply-chain-solution", "title": "Agent Supply Chain Playbook", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<script>window.__deckStart = __START__;<\/script>\n<meta charset=\"utf-8\">\n<title>Agent Supply Chain Playbook<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block\" rel=\"stylesheet\">\n<style>\n  :root { --bg:#0C1737; --card:#13214a; --line:#26386f; --orange:#EF7B30; --muted:#9fabcf; }\n  html,body { margin:0; background:var(--bg); }\n  .slide { width:1920px; height:1080px; box-sizing:border-box; padding:72px 96px 52px; background:radial-gradient(1100px 600px at 85% 0%, #1a2c63 0%, #0C1737 65%); color:#fff; font-family:Inter, Helvetica, Arial, sans-serif; display:flex; flex-direction:column; }\n  .eyebrow { font-weight:800; font-size:20px; letter-spacing:.14em; color:var(--orange); text-transform:uppercase; }\n  h1 { margin:14px 0 0; font-size:62px; line-height:1.06; font-weight:900; letter-spacing:-.015em; }\n  h1 em { font-style:normal; color:var(--orange); }\n\n  .why { margin-top:30px; display:flex; align-items:center; gap:30px; padding:16px 28px; border-left:6px solid var(--orange); background:rgba(239,123,48,.08); border-radius:0 14px 14px 0; }\n  .why .lbl { font-weight:900; font-size:18px; letter-spacing:.12em; color:var(--orange); text-transform:uppercase; white-space:nowrap; }\n  .why .facts { display:flex; gap:30px; font-size:19px; color:#dfe5f7; line-height:1.35; flex:1; }\n  .why .fact { display:flex; align-items:center; gap:16px; flex:1; }\n  .why .big { font-size:42px; font-weight:900; color:#fff; white-space:nowrap; }\n  .why .fact span:last-child { white-space:nowrap; }\n  .why .fact.wide { flex:1.3; }\n  .why .sep { width:2px; background:rgba(239,123,48,.55); border-radius:1px; align-self:stretch; margin:2px 0; }\n  .why b { color:#fff; }\n\n  .cards { margin-top:28px; flex:1; display:grid; grid-template-columns:repeat(4, 1fr); gap:26px; }\n  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:28px 28px 22px; display:flex; flex-direction:column; }\n  .head { display:flex; align-items:flex-start; gap:16px; }\n  .num { width:50px; height:50px; border-radius:50%; background:var(--orange); color:#0C1737; font-weight:900; font-size:26px; display:grid; place-items:center; flex:none; margin-top:4px; }\n  .verb { font-size:17px; font-weight:800; letter-spacing:.14em; color:var(--orange); text-transform:uppercase; }\n  .what { font-size:27px; font-weight:800; line-height:1.15; margin-top:2px; min-height:62px; }\n  ul { list-style:none; padding:0; margin:22px 0 0; display:flex; flex-direction:column; gap:15px; }\n  li { font-size:19px; line-height:1.36; color:#d6ddf2; padding-left:22px; position:relative; }\n  li::before { content:\"\"; position:absolute; left:0; top:10px; width:9px; height:9px; border-radius:50%; background:var(--orange); }\n  li b { color:#fff; }\n  .where { margin-top:auto; padding-top:16px; border-top:1px solid var(--line); font-size:15px; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; font-weight:700; }\n  .where span { color:#ffb98a; }\n\n  .chain { margin-top:24px; display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; color:#c9d1ea; }\n  .chain .lead { color:var(--orange); letter-spacing:.12em; text-transform:uppercase; font-weight:900; margin-right:8px; }\n  .chip { padding:9px 15px; border-radius:10px; background:#13214a; border:1px solid var(--line); }\n  .arr { color:#56679c; }\n  .foot { margin-top:18px; font-size:14px; color:#7f8bb3; }\n<\/style>\n<style>\n/* Step-by-step builds for the CTA slides. Loaded by the *-animated.html files. */\nhtml, body { height:100%; margin:0; overflow:hidden; background:#0C1737; cursor:default; }\n.slide { position:absolute; top:0; left:0; transform-origin:0 0; }\n\n/* A build step: fades and slides up when it becomes active */\n.b { opacity:0; transform:translateY(26px); transition:opacity .55s ease, transform .7s cubic-bezier(.2,.8,.2,1); }\n.b.on { opacity:1; transform:none; transition-delay:var(--d, 0ms); }\n\n/* Items inside a step (bullets, chips) arrive one after another */\n.sub { opacity:0; transform:translateY(12px); transition:opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1); }\n.on .sub { opacity:1; transform:none; transition-delay:var(--d, 0ms); }\n\n/* Facts in the \"Why now\" strip slide in from the left */\n.why .facts > .sub { transform:translateX(-22px); }\n.why.on .facts > .sub { transform:none; }\n\n/* Only while a number counts up: fixed-width digits so the text beside it stays put */\n.big.counting { font-variant-numeric:tabular-nums; display:inline-block; }\n\n/* Highlighted policy-chain chips pulse once after the chain lands */\n@keyframes hotpulse {\n  0%   { box-shadow:0 0 0 0 rgba(239,123,48,0); }\n  45%  { box-shadow:0 0 0 9px rgba(239,123,48,.38); }\n  100% { box-shadow:0 0 0 0 rgba(239,123,48,0); }\n}\n.chain.on .chip.hot { animation:hotpulse 1.1s ease var(--h, 1s) 1 both; }\n\n/* ?static renders the final state of a step with no motion (used for PNG export) */\nhtml.static .b, html.static .sub { transition:none !important; }\nhtml.static .chip.hot { animation:none !important; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide\">\n  <div class=\"eyebrow\">Agent supply chain \u00b7 The fix<\/div>\n  <h1>Every skill, MCP server and model is code<br>you didn\u2019t write. <em>Vet it like code.<\/em><\/h1>\n\n  <div class=\"why\">\n    <div class=\"lbl\">Why now<\/div>\n    <div class=\"facts\">\n      <div class=\"fact wide\"><span class=\"big\">341<\/span><span>of 2,857 skills on ClawHub, OpenClaw\u2019s<br>marketplace, were malicious (Feb 2026)<\/span><\/div>\n      <div class=\"sep\"><\/div>\n      <div class=\"fact\"><span><b>Fake \u201cprerequisites\u201d<\/b> in those skills<br>installed password-stealing malware<\/span><\/div>\n      <div class=\"sep\"><\/div>\n      <div class=\"fact\"><span><b>Look-alike MCP servers:<\/b> a near-identical<br>name is all an attacker needs<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"cards\">\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">1<\/div><div><div class=\"verb\">Allowlist<\/div><div class=\"what\">Only approved sources<\/div><\/div><\/div>\n      <ul>\n        <li><b>Private catalog<\/b> of approved MCP servers, skills and models<\/li>\n        <li><b>Public marketplaces off by default<\/b>, with a request-to-add flow<\/li>\n        <li><b>Pin versions.<\/b> No silent auto-updates<\/li>\n      <\/ul>\n      <div class=\"where\">Runs in <span>API Portal &amp; AI Hub \u00b7 Model catalog<\/span><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">2<\/div><div><div class=\"verb\">Vet<\/div><div class=\"what\">Scan before first use<\/div><\/div><\/div>\n      <ul>\n        <li><b>Scan tool descriptions and skills<\/b> for hidden instructions<\/li>\n        <li><b>Check the publisher<\/b>, signature and provenance<\/li>\n        <li><b>Catch look-alike names<\/b> before they are installed<\/li>\n        <li><b>Models:<\/b> check source, license and file safety<\/li>\n      <\/ul>\n      <div class=\"where\">Runs in <span>AI Gateway \u00b7 Asset Discovery &amp; Catalog<\/span><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"head\"><div class=\"num\">3<\/div><div><div class=\"verb\">Contain<\/div><div class=\"what\">Least privilege at runtime<\/div><\/div><\/div>\n      <ul>\n        <li><b>Sandbox<\/b> agents and MCP servers<\/li>\n        <li><b>No raw keys in the agent:<\/b> the g   const stage = document.getElementById('stage');
  const hud = document.getElementById('hud');
  const frames = slides.map(() => { const f = document.createElement('iframe'); stage.appendChild(f); return f; });
  const steps = slides.map(() => null);
  let idx = 0, step = 0, pendingEnd = false;

  const fit = () => {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
  };
  addEventListener('resize', fit);
  fit();

  const showHud = () => {
    const n = steps[idx];
    hud.textContent = `${idx + 1} / ${slides.length} · ${slides[idx].title}` + (n ? ` · step ${step + 1} of ${n}` : '');
  };

  // Entering a slide reloads it, so its builds play from the start
  const enter = (i, atEnd) => {
    const old = frames[idx];
    idx = i; step = 0; pendingEnd = !!atEnd;
    const f = frames[i];
    f.onload = () => {
      f.onload = null;
      if (frames[idx] !== f) return;
      frames.forEach(o => o.classList.toggle('show', o === f));
      // Unload the slide we left once it has faded out
      if (old !== f) setTimeout(() => { if (frames[idx] !== old) { old.onload = null; old.removeAttribute('srcdoc'); } }, 600);
    };
    f.srcdoc = slides[i].html.replace('__START__', atEnd ? 9999 : 0);
    showHud();
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
  };

  addEventListener('message', e => {
    if (!e.data || e.data.deck !== 'ready') return;
    const i = frames.findIndex(f => f.contentWindow === e.source);
    if (i < 0) return;
    steps[i] = e.data.steps;
    if (i === idx && pendingEnd) { step = steps[i] - 1; pendingEnd = false; }
    showHud();
  });

  const go = s => { step = s; frames[idx].contentWindow.postMessage({ deck: 'go', step: s }, '*'); showHud(); };
  const next = () => {
    if (steps[idx] && step < steps[idx] - 1) go(step + 1);
    else if (steps[idx] && idx < slides.length - 1) enter(idx + 1);
  };
  const prev = () => {
    if (step > 0) go(step - 1);
    else if (idx > 0) enter(idx - 1, true);
  };

  addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') enter(0);
    else if (e.key === 'End') enter(slides.length - 1, true);
    else if (/^[1-9]$/.test(e.key) && +e.key <= slides.length) enter(+e.key - 1);
    else if (e.key === 'f' || e.key === 'F') {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    }
  });
  addEventListener('click', next);
  addEventListener('contextmenu', e => { e.preventDefault(); prev(); });

  let hideTimer;
  addEventListener('mousemove', () => {
    document.body.classList.add('ui');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => document.body.classList.remove('ui'), 1800);
  });

  const start = parseInt(location.hash.slice(1), 10);
  enter(start >= 1 && start <= slides.length ? start - 1 : 0);
})();
</script>
</body></html>
